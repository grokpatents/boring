<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- Tunnel walls -->
  <rect x="50" y="150" width="700" height="300" fill="none" stroke="#111" stroke-width="4"/>
  <!-- Floor -->
  <line x1="50" y1="450" x2="750" y2="450" stroke="#111" stroke-width="3"/>
  <!-- Vehicle body -->
  <rect x="320" y="280" width="160" height="80" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Wheels -->
  <circle cx="350" cy="370" r="18" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="450" cy="370" r="18" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Beacon on wall -->
  <rect x="200" y="160" width="12" height="20" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Leader lines and numerals -->
  <!-- 10 to vehicle -->
  <line x1="400" y1="280" x2="400" y2="220" stroke="#111" stroke-width="1"/>
  <text x="395" y="210" font-family="Helvetica, Arial, sans-serif" font-size="14">10</text>
  <!-- 12 to sensor -->
  <line x1="380" y1="300" x2="300" y2="250" stroke="#111" stroke-width="1"/>
  <text x="285" y="245" font-family="Helvetica, Arial, sans-serif" font-size="14">12</text>
  <!-- 20 to controller (outside) -->
  <line x1="750" y1="200" x2="780" y2="100" stroke="#111" stroke-width="1"/>
  <text x="770" y="95" font-family="Helvetica, Arial, sans-serif" font-size="14">20</text>
  <!-- Slot boundary lines -->
  <line x1="280" y1="200" x2="280" y2="440" stroke="#111" stroke-width="1" stroke-dasharray="4"/>
  <line x1="520" y1="200" x2="520" y2="440" stroke="#111" stroke-width="1" stroke-dasharray="4"/>
  <text x="270" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12">slot</text>
  <text x="510" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12">slot</text>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">FIG. 1</text>
  <!-- Extra elements for count: lidar rays, comm arrow -->
  <line x1="400" y1="280" x2="250" y2="300" stroke="#111" stroke-width="1"/>
  <line x1="400" y1="280" x2="550" y2="300" stroke="#111" stroke-width="1"/>
  <polygon points="780,180 790,200 770,200" fill="none" stroke="#111" stroke-width="2"/>
</svg>