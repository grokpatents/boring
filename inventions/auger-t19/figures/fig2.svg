<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- Central controller box -->
  <rect x="300" y="80" width="200" height="80" fill="none" stroke="#111" stroke-width="2"/>
  <text x="340" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12">Controller (20)</text>
  <!-- Vehicle firmware -->
  <rect x="100" y="300" width="140" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="115" y="335" font-family="Helvetica, Arial, sans-serif" font-size="11">Firmware (11)</text>
  <!-- Data flow arrows -->
  <line x1="400" y1="160" x2="170" y2="300" stroke="#111" stroke-width="2"/>
  <line x1="170" y1="360" x2="400" y2="160" stroke="#111" stroke-width="2"/>
  <!-- Sensor block -->
  <rect x="500" y="300" width="120" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="515" y="330" font-family="Helvetica, Arial, sans-serif" font-size="11">Load sensors (12)</text>
  <!-- Beacon input -->
  <rect x="50" y="420" width="100" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <text x="60" y="445" font-family="Helvetica, Arial, sans-serif" font-size="10">Beacons</text>
  <!-- Slot map -->
  <rect x="550" y="80" width="150" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="565" y="115" font-family="Helvetica, Arial, sans-serif" font-size="11">Slot table</text>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">FIG. 2</text>
  <!-- Leader lines to numerals -->
  <line x1="400" y1="120" x2="400" y2="50" stroke="#111" stroke-width="1"/>
  <text x="390" y="45" font-family="Helvetica, Arial, sans-serif" font-size="14">20</text>
  <line x1="170" y1="330" x2="80" y2="280" stroke="#111" stroke-width="1"/>
  <text x="60" y="275" font-family="Helvetica, Arial, sans-serif" font-size="14">11</text>
  <line x1="560" y1="325" x2="620" y2="250" stroke="#111" stroke-width="1"/>
  <text x="615" y="245" font-family="Helvetica, Arial, sans-serif" font-size="14">12</text>
</svg>